<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Depari Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Buat Akun</h2>
    <div class="sub">Daftar pakai email atau nomor WhatsApp. Pendaftar pertama otomatis menjadi pemilik toko.</div>
    <div class="alert" id="alertBox"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Nama</label>
        <input type="text" id="name" placeholder="Nama kamu" required>
      </div>
      <div class="field">
        <label for="email">Email (opsional jika isi WhatsApp)</label>
        <input type="email" id="email" placeholder="contoh@email.com">
      </div>
      <div class="field">
        <label for="phone">Nomor WhatsApp (opsional jika isi email)</label>
        <input type="text" id="phone" placeholder="08xxxxxxxxxx">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter" required>
      </div>
      <button type="submit" class="btn btn-ink btn-block">Daftar</button>
    </form>

    <div class="auth-links">
      Sudah punya akun? <a href="/login.html">Masuk di sini</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
renderNavbar();
const alertBox = document.getElementById('alertBox');

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;

  if (!email && !phone) {
    showAlert(alertBox, 'Isi salah satu: email atau nomor WhatsApp.');
    return;
  }

  try {
    const { token, user } = await API.request('/auth/register', {
      method: 'POST',
      body: { name, email: email || undefined, phone: phone || undefined, password },
    });
    API.setSession(token, user);
    window.location.href = '/index.html';
  } catch (err) {
    showAlert(alertBox, err.message);
  }
});
</script>
</body>
  </html>
