<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password — Depari Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Lupa Password</h2>
    <div class="sub">Masukkan email akun kamu. Kami akan kirim link untuk membuat password baru.</div>
    <div class="alert" id="alertBox"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="contoh@email.com" required>
      </div>
      <button type="submit" class="btn btn-ink btn-block">Kirim Link Reset</button>
    </form>

    <div class="auth-links">
      <a href="/login.html">Kembali ke halaman masuk</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
renderNavbar();
const alertBox = document.getElementById('alertBox');

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  try {
    const { message } = await API.request('/auth/forgot-password', { method: 'POST', body: { email } });
    showAlert(alertBox, message, 'success');
  } catch (err) {
    showAlert(alertBox, err.message);
  }
});
</script>
</body>
  </html>
