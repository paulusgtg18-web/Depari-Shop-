<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Depari Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Buat Password Baru</h2>
    <div class="sub">Masukkan password baru untuk akun kamu.</div>
    <div class="alert" id="alertBox"></div>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">Password Baru</label>
        <input type="password" id="newPassword" placeholder="Minimal 6 karakter" required>
      </div>
      <button type="submit" class="btn btn-ink btn-block">Simpan Password</button>
    </form>

    <div class="auth-links">
      <a href="/login.html">Kembali ke halaman masuk</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
renderNavbar();
const alertBox = document.getElementById('alertBox');
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  showAlert(alertBox, 'Link reset password tidak valid. Minta link baru lewat halaman "Lupa Password".');
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;

  try {
    const { message } = await API.request('/auth/reset-password', { method: 'POST', body: { token, newPassword } });
    showAlert(alertBox, message + ' Mengalihkan ke halaman masuk...', 'success');
    setTimeout(() => window.location.href = '/login.html', 1800);
  } catch (err) {
    showAlert(alertBox, err.message);
  }
});
</script>
</body>
</html>
